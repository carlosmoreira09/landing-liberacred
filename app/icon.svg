<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#0066CC" rx="8"/>
  <g fill="#FFFFFF">
    <!-- Back wheel -->
    <circle cx="16" cy="42" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="16" cy="42" r="3" fill="#FFFFFF"/>

    <!-- Front wheel -->
    <circle cx="48" cy="42" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="48" cy="42" r="3" fill="#FFFFFF"/>

    <!-- Frame -->
    <path d="M 16 42 L 24 28 L 32 22 L 44 22 L 48 42" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Seat -->
    <path d="M 20 28 L 36 28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Handlebars -->
    <path d="M 44 22 L 46 18 M 44 22 L 42 18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Fuel tank -->
    <ellipse cx="32" cy="25" rx="6" ry="4" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
